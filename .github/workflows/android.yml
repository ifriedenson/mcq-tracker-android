name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # android-actions/setup-android@v3 dies on "Failed to find package
      # 'tools'" because Google's repository no longer publishes that package.
      # The runner image already ships an SDK, so use it and install only the
      # packages this build needs.
      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "Android SDK ready at $SDK"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publish the APK to a rolling release, so it can be downloaded and
      # installed straight from a phone instead of unzipping a build artifact.
      - name: Publish debug APK to the latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Latest debug build" \
            --notes "Debug APK built from ${GITHUB_SHA}." \
            --latest
